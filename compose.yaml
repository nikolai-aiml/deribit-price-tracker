
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: prices
      POSTGRES_USER: prices_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prices_user -d prices"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://prices_user:${POSTGRES_PASSWORD}@db:5432/prices
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO --pool=solo
    environment:
      DATABASE_URL: postgresql+psycopg://prices_user:${POSTGRES_PASSWORD}@db:5432/prices
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://prices_user:${POSTGRES_PASSWORD}@db:5432/prices
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data: